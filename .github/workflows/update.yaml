name: Update Quartz Framework

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Runs weekly on Mondays at midnight UTC

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm i

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Quartz Upgrade
        run: |
          git remote add upstream https://github.com/jackyzha0/quartz.git 2>/dev/null || true
          git fetch upstream v5

          ORIG_HEAD=$(git rev-parse HEAD)
          git merge -X ours --no-edit --allow-unrelated-histories upstream/v5 || {
            git checkout --ours package.json package-lock.json 2>/dev/null || true
            git add package.json package-lock.json 2>/dev/null || true
            git commit --no-edit || true
          }

          # Soft-reset merge so foreign workflow commits are squashed and excluded from history
          git reset --soft "$ORIG_HEAD"
          git reset HEAD -- .github/
          git checkout HEAD -- .github/ 2>/dev/null || true
          git clean -fd .github/ 2>/dev/null || true

          npm i
          npx quartz restore 2>/dev/null || true

      - name: Check for changes and commit
        run: |
          git add .
          git reset HEAD -- .github/
          if git diff --cached --quiet; then
            echo "Quartz is already up to date."
          else
            git commit -m "chore: auto-upgrade Quartz framework to latest version"
            git push origin v5
          fi
